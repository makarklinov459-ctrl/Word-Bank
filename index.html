<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Копилка слов</title>
<style>
  :root {
    --indigo: #4f46e5;
    --indigo-dark: #3f37c9;
    --indigo-soft: #eef0ff;
    --ink: #17171f;
    --muted: #6b6f80;
    --line: #e3e5f0;
    --good: #16a34a;
    --bad: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: linear-gradient(160deg, #eef0ff 0%, #f8f9ff 45%, #ffffff 100%) fixed;
    color: var(--ink);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 32px 16px 56px;
  }
  .wrap { max-width: 680px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 26px; }
  h1 {
    margin: 0; display: inline-flex; align-items: center; gap: 12px;
    color: var(--indigo-dark); font-size: clamp(30px, 7vw, 44px); letter-spacing: -0.02em; font-weight: 800;
  }
  h1 svg { width: 1.05em; height: 1.05em; flex: none; }
  .sub { margin: 10px 0 0; color: var(--muted); font-size: clamp(16px, 3.8vw, 20px); }

  .tabs { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 26px; }
  .tab {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    font: inherit; font-weight: 600; padding: 13px 26px; border-radius: 999px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(30, 30, 80, .04);
    transition: background .15s, color .15s, transform .05s;
  }
  .tab:active { transform: scale(.98); }
  .tab.on { background: var(--indigo); border-color: var(--indigo); color: #fff; box-shadow: 0 8px 20px rgba(79, 70, 229, .28); }
  .tab .n { font-weight: 700; margin-left: 4px; }

  .panel {
    background: #fff; border-radius: 28px; padding: 22px;
    box-shadow: 0 18px 50px rgba(40, 40, 110, .09), 0 2px 6px rgba(40, 40, 110, .04);
  }
  .view[hidden] { display: none; }

  .row { display: flex; gap: 12px; }
  input[type=text] {
    flex: 1; min-width: 0; font: inherit; color: var(--ink);
    padding: 15px 18px; border-radius: 16px; border: 1px solid var(--line); background: #fff;
  }
  input[type=text]::placeholder { color: #9a9eb0; }
  input[type=text]:focus { outline: 3px solid rgba(79, 70, 229, .25); border-color: var(--indigo); }
  .btn {
    border: 0; border-radius: 16px; background: var(--indigo); color: #fff;
    font: inherit; font-weight: 700; padding: 0 26px; min-height: 52px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--indigo-dark); }
  .btn.ghost { background: var(--indigo-soft); color: var(--indigo-dark); }
  .btn.ghost:hover { background: #e2e6ff; }
  .btn:disabled, input:disabled { opacity: .55; cursor: default; }

  .result { margin-top: 18px; background: var(--indigo-soft); border-radius: 20px; padding: 20px 22px; }
  .result[hidden] { display: none; }
  .result .line { margin: 0 0 8px; }
  .result .line:last-child { margin-bottom: 0; }
  .result b { font-weight: 700; }
  .result .en { color: var(--indigo-dark); font-size: 24px; font-weight: 800; }
  .result .ru { font-size: 22px; font-weight: 800; }
  .status-good { color: var(--good); font-weight: 600; }
  .status-note { color: var(--muted); }
  .status-bad { color: var(--bad); font-weight: 600; }
  .dots { display: inline-flex; gap: 5px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--indigo); animation: blink 1.1s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .list-title { margin: 24px 0 8px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; align-items: center; gap: 10px; padding: 11px 2px; border-bottom: 1px solid var(--line); }
  .list li:last-child { border-bottom: 0; }
  .list .ru { font-weight: 700; }
  .list .arrow { color: var(--muted); }
  .list .en { color: var(--indigo-dark); font-weight: 600; flex: 1; overflow-wrap: anywhere; }
  .del {
    border: 0; background: transparent; color: #a0a4b8; font-size: 22px; line-height: 1;
    width: 34px; height: 34px; border-radius: 10px; cursor: pointer;
  }
  .del:hover { background: #fdeaea; color: var(--bad); }
  .empty { color: var(--muted); text-align: center; padding: 22px 0; }

  .progress { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
  .bar { height: 6px; background: var(--indigo-soft); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
  .bar i { display: block; height: 100%; background: var(--indigo); border-radius: 99px; transition: width .25s; }
  .ask { font-size: 15px; color: var(--muted); margin: 0 0 4px; }
  .word { font-size: clamp(30px, 8vw, 40px); font-weight: 800; margin: 0 0 18px; overflow-wrap: anywhere; }
  .feedback { margin-top: 16px; }
  .feedback[hidden] { display: none; }
  .score { font-size: 28px; font-weight: 800; color: var(--indigo-dark); margin: 4px 0 6px; }

  .foot { text-align: center; color: var(--muted); font-size: 13px; margin: 18px 0 0; }

  @media (max-width: 520px) {
    body { padding: 22px 12px 44px; }
    .panel { padding: 16px; border-radius: 24px; }
    .tab { padding: 12px 20px; }
    .row { flex-direction: column; }
    .btn { min-height: 50px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>
      <svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">
        <ellipse cx="30" cy="35" rx="21" ry="16"/>
        <path d="M44 24l6-9 1 12z"/>
        <rect x="47" y="30" width="12" height="11" rx="5"/>
        <rect x="16" y="45" width="8" height="12" rx="3"/>
        <rect x="36" y="45" width="8" height="12" rx="3"/>
        <path d="M8 30c-5-1-6-6-3-9 3 2 4 5 5 7z"/>
        <rect x="24" y="17" width="12" height="3.500" rx="1.700" fill="#fff"/>
        <circle cx="46" cy="29" r="2" fill="#fff"/>
      </svg>
      Копилка Слов
    </h1>
    <p class="sub">Добавляй слова → перевод → учись</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab on" data-tab="add" role="tab">Добавить</button>
    <button class="tab" data-tab="bank" role="tab">Копилка <span class="n" id="cnt">0</span></button>
    <button class="tab" data-tab="learn" role="tab">Учить</button>
  </nav>

  <main class="panel">
    <!-- Добавить -->
    <section class="view" id="view-add">
      <form class="row" id="addForm" autocomplete="off">
        <input type="text" id="addInp" placeholder="Слово по-русски или English (дом, run, плакать…)" maxlength="60" enterkeyhint="send" autocapitalize="off">
        <button class="btn" id="addBtn" type="submit">Добавить</button>
      </form>
      <div class="result" id="result" hidden></div>
      <div class="list-title" id="miniTitle">Копилка</div>
      <ul class="list" id="miniList"></ul>
    </section>

    <!-- Копилка -->
    <section class="view" id="view-bank" hidden>
      <div class="list-title" style="margin-top:0" id="bankTitle">Копилка</div>
      <ul class="list" id="bankList"></ul>
    </section>

    <!-- Учить -->
    <section class="view" id="view-learn" hidden>
      <div id="learnBody"></div>
    </section>
  </main>
  <p class="foot">Переводы: Google Translate (запасной — MyMemory) · примеры: Google, Free Dictionary, Tatoeba · слова хранятся в этом браузере</p>
</div>

<script>
(function () {
  var KEY = 'kopilka-slov-v1';
  var state = { words: [], busy: false, quiz: null };

  var $ = function (id) { return document.getElementById(id); };
  var addForm = $('addForm'), addInp = $('addInp'), addBtn = $('addBtn'), resultEl = $('result');

  /* ---------- helpers ---------- */
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function norm(s) { return String(s).trim().toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' '); }
  function normEn(s) {
    return String(s).trim().toLowerCase().replace(/[.!?,;:"“”]/g, '').replace(/\s+/g, ' ').replace(/^(to|a|an|the)\s+/, '');
  }
  function plural(n) {
    var a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return 'слово';
    if (a >= 2 && a <= 4 && !(b >= 12 && b <= 14)) return 'слова';
    return 'слов';
  }
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function str(v, max) { return typeof v === 'string' ? v.trim().slice(0, max) : ''; }
  function withTimeout(p, ms) {
    return Promise.race([p, new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, ms); })]);
  }
  function parseJSON(t) {
    var a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a < 0 || b < a) return null;
    try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { return null; }
  }

  /* ---------- storage ---------- */
  function cleanWords(arr) {
    if (!Array.isArray(arr)) return [];
    return arr.filter(function (w) { return w && typeof w.ru === 'string' && typeof w.en === 'string'; })
      .map(function (w) {
        return {
          ru: w.ru, en: w.en,
          alt: Array.isArray(w.alt) ? w.alt.filter(function (a) { return typeof a === 'string'; }) : [],
          ex: typeof w.ex === 'string' ? w.ex : ''
        };
      });
  }
  function loadLocal() {
    try { state.words = cleanWords(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) { state.words = []; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state.words)); } catch (e) {}
    renderBank();
  }
  /* ---------- bank rendering ---------- */
  function fillList(ul, withDelete) {
    ul.textContent = '';
    if (!state.words.length) {
      var li = el('li', 'empty', 'Пока пусто — добавь первое слово.');
      li.style.justifyContent = 'center';
      ul.appendChild(li);
      return;
    }
    state.words.forEach(function (w, i) {
      var li = el('li');
      li.appendChild(el('span', 'ru', w.ru));
      li.appendChild(el('span', 'arrow', '→'));
      li.appendChild(el('span', 'en', w.en));
      if (withDelete) {
        var d = el('button', 'del', '×');
        d.type = 'button';
        d.setAttribute('aria-label', 'Удалить «' + w.ru + '»');
        d.addEventListener('click', function () { state.words.splice(i, 1); save(); });
        li.appendChild(d);
      }
      ul.appendChild(li);
    });
  }
  function renderBank() {
    var n = state.words.length;
    var title = 'Копилка · ' + n + ' ' + plural(n);
    $('cnt').textContent = n;
    $('miniTitle').textContent = title;
    $('bankTitle').textContent = title;
    fillList($('miniList'), false);
    fillList($('bankList'), true);
  }

  /* ---------- tabs ---------- */
  var tabs = document.querySelectorAll('.tab');
  function showTab(name) {
    tabs.forEach(function (t) { t.classList.toggle('on', t.dataset.tab === name); });
    ['add', 'bank', 'learn'].forEach(function (v) { $('view-' + v).hidden = v !== name; });
    if (name === 'learn') startQuiz();
    if (name === 'add') addInp.focus();
  }
  tabs.forEach(function (t) { t.addEventListener('click', function () { showTab(t.dataset.tab); }); });

  /* ---------- add ---------- */
  function setBusy(b) {
    state.busy = b;
    addInp.disabled = b;
    addBtn.disabled = b;
    if (!b) addInp.focus();
  }
  function resultLine(label, value, cls) {
    var p = el('p', 'line');
    p.appendChild(el('b', null, label + ' '));
    p.appendChild(el('span', cls || null, value));
    return p;
  }
  function showCard(w, status, statusCls) {
    resultEl.hidden = false;
    resultEl.textContent = '';
    resultEl.appendChild(resultLine('Русский:', w.ru, 'ru'));
    resultEl.appendChild(resultLine('English:', w.en, 'en'));
    resultEl.appendChild(resultLine('Пример:', w.ex || '—'));
    if (status) resultEl.appendChild(el('p', 'line ' + statusCls, status));
  }
  function showMessage(text, cls) {
    resultEl.hidden = false;
    resultEl.textContent = '';
    resultEl.appendChild(el('p', 'line ' + (cls || ''), text));
  }
  function showTyping() {
    resultEl.hidden = false;
    resultEl.textContent = '';
    var d = el('span', 'dots');
    d.appendChild(el('i')); d.appendChild(el('i')); d.appendChild(el('i'));
    resultEl.appendChild(d);
  }

  /* ---------- перевод (MyMemory) и примеры (dictionaryapi.dev, Tatoeba) ---------- */
  function fail(code) { var e = new Error(code); e.code = code; return e; }

  function cleanTr(x) {
    return String(x || '').replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&amp;/g, '&')
      .trim().replace(/[.!?]+$/, '').toLowerCase().slice(0, 60);
  }

  async function translateMM(text, from, to) {
    var url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + from + '|' + to;
    var r;
    try { r = await fetch(url); } catch (e) { throw fail('network'); }
    if (!r.ok) throw fail(r.status === 429 ? 'quota' : 'network');
    var j = await r.json();
    var main = j && j.responseData ? String(j.responseData.translatedText || '') : '';
    if (/MYMEMORY WARNING|ALL AVAILABLE FREE TRANSLATIONS/i.test(main) || Number(j.responseStatus) === 429) throw fail('quota');
    var targetRe = to === 'ru' ? /[а-яё]/i : /[a-z]/i;
    var seen = {};
    var cands = [];
    function push(x) {
      var c = cleanTr(x);
      if (!c || seen[c] || !targetRe.test(c) || c.split(' ').length > 3) return;
      if (norm(c) === norm(text)) return;
      seen[c] = true;
      cands.push(c);
    }
    push(main);
    if (j && Array.isArray(j.matches)) {
      j.matches.slice().sort(function (a, b) { return (Number(b.match) || 0) - (Number(a.match) || 0); })
        .forEach(function (m) { push(m.translation); });
    }
    if (!cands.length) throw fail('notfound');
    return { main: cands[0], alts: cands.slice(1, 4) };
  }

  function stripTags(x) { return String(x || '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim(); }

  async function googleRaw(text, from, to, withExamples) {
    var url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + from + '&tl=' + to +
      '&dt=t&dt=bd' + (withExamples ? '&dt=ex' : '') + '&q=' + encodeURIComponent(text);
    var r = await fetch(url);
    if (!r.ok) throw new Error('http ' + r.status);
    var j = await r.json();
    if (!Array.isArray(j)) throw new Error('bad');
    return j;
  }

  async function translateG(text, from, to) {
    var j = await googleRaw(text, from, to, false);
    var main = Array.isArray(j[0]) ? j[0].map(function (p) { return p && p[0] ? p[0] : ''; }).join('') : '';
    var targetRe = to === 'ru' ? /[а-яё]/i : /[a-z]/i;
    main = cleanTr(main);
    if (!main || !targetRe.test(main) || norm(main) === norm(text)) throw fail('notfound');
    var alts = [];
    if (Array.isArray(j[1])) {
      j[1].forEach(function (pos) {
        (Array.isArray(pos[1]) ? pos[1] : []).forEach(function (w) {
          var c = cleanTr(w);
          if (c && c !== main && alts.indexOf(c) === -1 && targetRe.test(c) && c.split(' ').length <= 2) alts.push(c);
        });
      });
    }
    return { main: main, alts: alts.slice(0, 4) };
  }

  async function translate(text, from, to) {
    try { return await translateG(text, from, to); }
    catch (e) { return translateMM(text, from, to); } // запасной переводчик
  }

  function goodExample(x, w) {
    var t = stripTags(x).replace(/^["“]|["”]$/g, '');
    var words = t.split(' ');
    if (words.length < 4 || words.length > 14 || t.length > 100) return '';
    var re = new RegExp('(^|[^a-z])' + w.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&') + '[a-z]{0,3}([^a-z]|$)', 'i');
    return re.test(t) ? t : '';
  }

  async function getExample(en) {
    var w = en.replace(/^(to|a|an|the)\s+/, '').trim().toLowerCase();
    if (!w) return '';
    // 1) примеры из Google Translate
    try {
      var j = await googleRaw(w, 'en', 'ru', true);
      var block = j[13] && j[13][0];
      var found = (Array.isArray(block) ? block : []).map(function (e) { return goodExample(e && e[0], w); })
        .filter(Boolean).sort(function (a, b) { return a.length - b.length; });
      if (found.length) return found[0];
    } catch (e) {}
    // 2) Free Dictionary
    if (/^[a-z-]+$/.test(w)) {
      try {
        var r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(w));
        if (r.ok) {
          var d = await r.json();
          var f2 = [];
          (Array.isArray(d) ? d : []).forEach(function (e1) {
            (e1.meanings || []).forEach(function (m) {
              (m.definitions || []).forEach(function (df) { var g = goodExample(df.example, w); if (g) f2.push(g); });
            });
          });
          f2.sort(function (a, b) { return a.length - b.length; });
          if (f2.length) return f2[0];
        }
      } catch (e) {}
    }
    // 3) Tatoeba
    try {
      var r2 = await fetch('https://tatoeba.org/en/api_v0/search?from=eng&query=' + encodeURIComponent('=' + w) + '&orphans=no&unapproved=no&sort=relevance');
      if (r2.ok) {
        var d2 = await r2.json();
        var texts = (d2.results || []).map(function (x) { return goodExample(x.text, w); }).filter(Boolean)
          .sort(function (a, b) { return a.length - b.length; });
        if (texts.length) return texts[0];
      }
    } catch (e) {}
    return '';
  }

  async function addWord(t) {
    var isRu = /[а-яё]/i.test(t);
    var isEn = !isRu && /[a-z]/i.test(t);
    if ((!isRu && !isEn) || t.length > 40) {
      showMessage('Напиши слово по-русски или по-английски, например «дом» или house. Чтобы потренироваться, напиши «учи» или «повторить».', 'status-note');
      return;
    }
    var exist = state.words.find(function (w) {
      return isRu ? norm(w.ru) === norm(t) : normEn(w.en) === normEn(t);
    });
    if (exist) { showCard(exist, 'Это слово уже в копилке.', 'status-note'); return; }
    setBusy(true);
    showTyping();
    try {
      var ru, en, alt = [];
      if (isRu) {
        var tr = await translate(t.trim(), 'ru', 'en');
        ru = t.trim().toLowerCase(); en = tr.main; alt = tr.alts;
      } else {
        var tr2 = await translate(t.trim(), 'en', 'ru');
        en = t.trim().toLowerCase(); ru = tr2.main;
      }
      var dup = state.words.find(function (w) { return norm(w.ru) === norm(ru) || normEn(w.en) === normEn(en); });
      if (dup) {
        showCard(dup, 'Это слово уже в копилке.', 'status-note');
      } else {
        var ex = '';
        try { ex = await getExample(en); } catch (e) {}
        var entry = { ru: ru, en: en, alt: alt, ex: ex };
        state.words.push(entry);
        save();
        showCard(entry, 'Добавлено!', 'status-good');
      }
    } catch (e) {
      var msg = 'Не получилось перевести. Слово не добавлено — попробуй ещё раз.';
      if (e && e.code === 'network') msg = 'Нет связи с переводчиком. Проверь интернет и попробуй ещё раз.';
      else if (e && e.code === 'quota') msg = 'Дневной лимит бесплатного переводчика исчерпан. Попробуй завтра.';
      else if (e && e.code === 'notfound') msg = 'Не нашёл перевод. Проверь, как написано слово.';
      showMessage(msg, 'status-bad');
    } finally {
      setBusy(false);
    }
  }

  var LEARN = ['учи', 'учить', 'повторить', 'повтори', 'повторение'];
  addForm.addEventListener('submit', function (e) {
    e.preventDefault();
    if (state.busy) return;
    var t = addInp.value.trim();
    if (!t) return;
    addInp.value = '';
    if (LEARN.indexOf(norm(t)) !== -1) { showTab('learn'); return; }
    addWord(t);
  });

  /* ---------- quiz ---------- */
  var body = $('learnBody');

  function startQuiz() {
    body.textContent = '';
    if (!state.words.length) {
      body.appendChild(el('div', 'empty', 'В копилке пока нет слов. Сначала добавь несколько на вкладке «Добавить».'));
      state.quiz = null;
      return;
    }
    state.quiz = { pool: shuffle(state.words.slice()).slice(0, 10), i: 0, score: 0, answered: false };
    renderQuestion();
  }

  function renderQuestion() {
    var q = state.quiz, w = q.pool[q.i];
    q.answered = false;
    body.textContent = '';
    body.appendChild(el('div', 'progress', 'Вопрос ' + (q.i + 1) + ' из ' + q.pool.length));
    var bar = el('div', 'bar'), fill = el('i');
    fill.style.width = (q.i / q.pool.length * 100) + '%';
    bar.appendChild(fill);
    body.appendChild(bar);
    body.appendChild(el('p', 'ask', 'Как по-английски?'));
    body.appendChild(el('p', 'word', w.ru));

    var form = el('form', 'row');
    form.autocomplete = 'off';
    var inp = el('input');
    inp.type = 'text';
    inp.placeholder = 'Ответ по-английски…';
    inp.autocapitalize = 'off';
    inp.setAttribute('autocorrect', 'off');
    inp.setAttribute('enterkeyhint', 'send');
    var btn = el('button', 'btn', 'Проверить');
    btn.type = 'submit';
    form.appendChild(inp);
    form.appendChild(btn);
    body.appendChild(form);

    var fb = el('div', 'result feedback');
    fb.hidden = true;
    body.appendChild(fb);

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (q.answered) { next(); return; }
      var ans = inp.value.trim();
      if (!ans) return;
      q.answered = true;
      var variants = [w.en].concat(w.alt || []).map(normEn);
      var ok = variants.indexOf(normEn(ans)) !== -1;
      if (ok) q.score++;
      inp.disabled = true;
      fb.hidden = false;
      fb.textContent = '';
      if (ok) {
        fb.appendChild(el('p', 'line status-good', 'Верно!'));
        fb.appendChild(resultLine('English:', w.en, 'en'));
      } else {
        fb.appendChild(el('p', 'line status-bad', 'Неверно'));
        fb.appendChild(resultLine('Правильно:', w.en, 'en'));
      }
      if (w.ex) fb.appendChild(resultLine('Пример:', w.ex));
      btn.textContent = q.i + 1 >= q.pool.length ? 'Закончить' : 'Дальше';
      btn.className = 'btn';
      btn.focus();
    });
    inp.focus();
  }

  function next() {
    var q = state.quiz;
    q.i++;
    if (q.i >= q.pool.length) renderDone(); else renderQuestion();
  }

  function renderDone() {
    var q = state.quiz;
    body.textContent = '';
    body.appendChild(el('p', 'ask', 'Готово!'));
    body.appendChild(el('p', 'score', q.score + ' из ' + q.pool.length));
    var again = el('button', 'btn', 'Ещё раз');
    again.type = 'button';
    again.addEventListener('click', startQuiz);
    body.appendChild(again);
    var n = state.words.length;
    body.appendChild(el('div', 'list-title', 'Копилка · ' + n + ' ' + plural(n)));
    var ul = el('ul', 'list');
    body.appendChild(ul);
    fillList(ul, false);
    state.quiz = null;
  }

  /* ---------- start ---------- */
  loadLocal();
  renderBank();
})();
</script>
</body>
</html>
